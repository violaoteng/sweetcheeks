<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="static/css/form.css">
</head>
<body>
     <header id="header">
    <nav class="navbar">
        <h2 class="logo">Sweet Cheeks Restaurant</h2>
        <div class="nav-links">           
            <a href="index.html"> Home </a>
            <a href="menu.html"> Menu </a>
            <a href=""> About </a>
            <a href="contact.html"> Contact </a>
            <a href=""> Reservation </a>
        </div>
    </nav>    
   </header>
    <div class="container">
        <h3>Contact Us</h3><br>
        <p class="feedback">We value your feedback!</p><br>
        <form action="">
            <div class="input-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>             
            <div class="input-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>
            <div class="input-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>

    </div>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.8127100295337!2d33.97337349678956!3d0.0960848000000011!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177fda817665e21d%3A0x8a0d4edc3d5d82de!2sPort%20Bunyala!5e0!3m2!1sen!2ske!4v1792274486165!5m2!1sen!2ske" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    
</body>
</html>
